  <text x="1148" y="54" text-anchor="end" class="node-sub">Qwen3.5 LiveTranslate / Qwen-MT / CosyVoice</text>

  <rect x="24" y="98" width="1152" height="158" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
