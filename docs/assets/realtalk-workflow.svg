<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">RealTalk_AI &#x5B9E;&#x65F6;&#x8BED;&#x97F3;&#x7FFB;&#x8BD1;&#x6D41;&#x7A0B;</title>
  <desc id="desc">Real-time two-way speech translation workflow</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 26px "Microsoft YaHei UI","PingFang SC",sans-serif;fill:#0f172a}
      .lane-title{font:700 16px "Microsoft YaHei UI","PingFang SC",sans-serif;fill:#334155}
      .node-title{font:700 14px "Microsoft YaHei UI","PingFang SC",sans-serif;fill:#0f172a}
      .node-sub{font:12px "Microsoft YaHei UI","PingFang SC",sans-serif;fill:#64748b}
      .edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .edge-blue{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrowBlue)}
      .branch{fill:none;stroke:#7c3aed;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}
      .node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:12;filter:url(#shadow)}
      .cloud{fill:#fffbeb;stroke:#f59e0b}
      .ui{fill:#eff6ff;stroke:#3b82f6}
      .control{fill:#f0fdf4;stroke:#22c55e}
    </style>
  </defs>

  <rect width="1200" height="500" fill="#ffffff"/>
  <rect x="24" y="20" width="1152" height="58" rx="16" fill="url(#header)" stroke="#dbeafe"/>
